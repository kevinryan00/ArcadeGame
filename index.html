<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro Coin Dash Deluxe</title><style>body{margin:0;background:#111827;color:#fff;font-family:Courier New,monospace;display:flex;flex-direction:column;align-items:center;padding:10px}canvas{border:4px solid #00ff88;background:#000}button{padding:8px 14px;margin:4px;border:none;border-radius:8px;background:#00ff88;font-weight:bold}.controls{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><h1>Retro Coin Dash Deluxe</h1><div class='controls'><button id='startBtn'>▶ Start</button><button id='pauseBtn'>⏸ Pause</button><button id='muteBtn'>🔊 Sound</button></div><p>Score: <span id='score'>0</span> | Lives: <span id='lives'>3</span></p><canvas id='game' width='700' height='500'></canvas><script>const c=document.getElementById('game'),x=c.getContext('2d');let state='start',paused=false,muted=false,score=0,lives=3,titleY=-100,v=0;const p={x:330,y:430,w:30,h:30,s:6};let keys={},coins=[],enemies=[];document.addEventListener('keydown',e=>{keys[e.key]=true;if(state==='start'&&e.key==='Enter')start();if(e.key==='p')togglePause()});document.addEventListener('keyup',e=>keys[e.key]=false);const ac=new(window.AudioContext||window.webkitAudioContext)();function tone(f,d){if(muted)return;let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}function start(){state='play';score=0;lives=3;coins=[];enemies=[];if(ac.state==='suspended')ac.resume()}function togglePause(){if(state!=='play')return;paused=!paused;document.getElementById('pauseBtn').textContent=paused?'▶ Resume':'⏸ Pause'}document.getElementById('startBtn').onclick=start;document.getElementById('pauseBtn').onclick=togglePause;document.getElementById('muteBtn').onclick=()=>{muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇 Muted':'🔊 Sound'};setInterval(()=>{if(state==='play'&&!paused)coins.push({x:Math.random()*660,y:-20})},900);setInterval(()=>{if(state==='play'&&!paused)enemies.push({x:Math.random()*660,y:-20})},1200);function update(){if(keys.ArrowLeft)p.x-=p.s;if(keys.ArrowRight)p.x+=p.s;if(keys.ArrowUp)p.y-=p.s;if(keys.ArrowDown)p.y+=p.s;p.x=Math.max(0,Math.min(670,p.x));p.y=Math.max(0,Math.min(470,p.y));coins.forEach((o,i)=>{o.y+=3;if(p.x<o.x+18&&p.x+30>o.x&&p.y<o.y+18&&p.y+30>o.y){score+=10;tone(900,.08);coins.splice(i,1)} });enemies.forEach((o,i)=>{o.y+=4;if(p.x<o.x+22&&p.x+30>o.x&&p.y<o.y+22&&p.y+30>o.y){lives--;tone(180,.2);enemies.splice(i,1);if(lives<=0)state='gameover'}});document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;}function drawStart(){x.fillStyle='#000';x.fillRect(0,0,700,500);let t=Date.now()/1000;for(let i=0;i<100;i++){x.fillStyle='#fff';x.fillRect((i*71)%700,((i*37)+(t*60))%500,2,2)}if(titleY<120){v+=.6;titleY+=v;if(titleY>120){titleY=120;v*=-.4}}x.fillStyle=['#00ff88','#00ddff','#ffd700','#ff66ff'][Math.floor(t*3)%4];x.font='bold 48px Courier New';x.textAlign='center';x.fillText('RETRO COIN DASH',350,titleY);if(Math.floor(Date.now()/500)%2===0){x.fillStyle='#fff';x.fillText('PRESS START',350,380)}}function draw(){x.fillStyle='#000';x.fillRect(0,0,700,500);if(state==='start'){drawStart();return;} coins.forEach(o=>{x.fillStyle='gold';x.beginPath();x.arc(o.x,o.y,9,0,7);x.fill()});enemies.forEach(o=>{x.fillStyle='red';x.fillRect(o.x,o.y,22,22)});x.fillStyle='#00ff88';x.fillRect(p.x,p.y,p.w,p.h);if(paused){x.fillStyle='rgba(0,0,0,.7)';x.fillRect(0,0,700,500);x.fillStyle='#fff';x.font='40px Courier';x.fillText('PAUSED',250,250)}if(state==='gameover'){x.fillStyle='rgba(0,0,0,.8)';x.fillRect(0,0,700,500);x.fillStyle='red';x.font='42px Courier';x.fillText('GAME OVER',220,220)}}function loop(){if(state==='play'&&!paused)update();draw();requestAnimationFrame(loop)}loop();</script></body></html>
